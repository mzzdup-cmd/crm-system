name: TT → CRM Import

on:
  schedule:
    # Five daily slots MSK (UTC+3):
    # 13:00 MSK = 10:00 UTC
    # 17:00 MSK = 14:00 UTC
    # 19:00 MSK = 16:00 UTC
    # 22:00 MSK = 19:00 UTC
    # 03:00 MSK = 00:00 UTC
    - cron: "0 10 * * *"
    - cron: "0 14 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install functions dependencies
        working-directory: functions
        run: npm install

      - name: Import TT sheets into CRM
        working-directory: functions
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          TT_SHEET_TAB: TT
          MANAGER_TT_SPREADSHEETS_JSON: ${{ secrets.MANAGER_TT_SPREADSHEETS_JSON }}
        run: npm run tt-import
